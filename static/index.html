<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Magpie Routing</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0b0f14;
  color: #e8eef5;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 22px;
  -webkit-text-size-adjust: 100%;
}
header {
  padding: 14px 18px 8px;
  background: #121820;
  border-bottom: 1px solid #243041;
}
h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.2px;
}
#meta {
  margin-top: 6px;
  font-size: 17px;
  color: #9aa8b8;
}
#meta .ok { color: #5dde8a; }
#meta .bad { color: #ff6b6b; }
#stage {
  position: relative;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  flex-direction: column;
  min-height: calc(100vh - 88px);
  padding: 18px 16px 28px;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  overflow: hidden;
  background: -webkit-linear-gradient(top, #15202b 0%, #0b0f14 55%, #101820 100%);
  background: linear-gradient(to bottom, #15202b 0%, #0b0f14 55%, #101820 100%);
}
#agents {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  gap: 12px;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  min-height: 72px;
  margin-bottom: 12px;
}
.agent-cell {
  display: block;
  float: left;
  min-width: 120px;
  max-width: 220px;
  margin: 0 10px 10px 0;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #2a3a4c;
  background: #182230;
  color: #d5e0ea;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
@supports (display: flex) or (display: grid) {
  .agent-cell {
    float: none;
    margin: 0;
  }
}
.agent-cell.on {
  border-color: #5dde8a;
  background: #1a3a28;
  color: #e8eef5;
  -webkit-box-shadow: 0 0 14px rgba(93, 222, 138, 0.35);
  box-shadow: 0 0 14px rgba(93, 222, 138, 0.35);
}
#hub {
  -webkit-box-flex: 0;
  -webkit-flex: 0 0 auto;
  flex: 0 0 auto;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  min-height: 72px;
  padding: 24px 0;
  text-align: center;
}
#hub .hub-mark {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #e8eef5;
  text-shadow: 0 0 28px rgba(93, 222, 138, 0.25);
}
#hub .hub-sub {
  margin-top: 2px;
  font-size: 13px;
  color: #7f8c9b;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#trails {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 15;
  pointer-events: none;
  overflow: visible;
}
#models {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  gap: 10px;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  width: 100%;
  min-height: 88px;
  margin-top: 16px;
}
.model-cell {
  display: block;
  float: left;
  width: auto;
  margin: 0 10px 10px 0;
  padding: 12px 14px;
  min-height: 70px;
  border-radius: 12px;
  border: 1px solid #2a3a4c;
  background: #182230;
  color: #c8d4e0;
  font-size: 17px;
  line-height: 1.25;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}
@supports (display: flex) or (display: grid) {
  .model-cell {
    float: none;
    width: auto;
    margin: 0;
  }
}
.model-cell .chip-name {
  display: block;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-cell .chip-prov {
  display: block;
  margin-top: 4px;
  font-size: 13px;
  color: #7f8c9b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-cell.on {
  border-color: #5dde8a;
  background: #1a3a28;
  color: #e8eef5;
  -webkit-box-shadow: 0 0 14px rgba(93, 222, 138, 0.35);
  box-shadow: 0 0 14px rgba(93, 222, 138, 0.35);
}
#flier {
  position: absolute;
  top: 0;
  left: 0;
  width: 96px;
  height: 48px;
  color: #c8d4e0;
  z-index: 30;
  pointer-events: none;
  visibility: hidden;
}
#flier.boost .rt-flier .wing.near,
#flier.boost .rt-flier .wing.far {
  -webkit-animation-duration: 0.22s;
  animation-duration: 0.22s;
}
#flierFace {
  position: relative;
  width: 100%;
  height: 100%;
  -webkit-transform-origin: 50% 50%;
  transform-origin: 50% 50%;
}
#berry {
  position: absolute;
  left: 58px;
  top: 18px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #ff6b6b;
  border: 2px solid #0b0f14;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  display: none;
  z-index: 2;
}
.rt-flier .body,
.rt-flier .tail,
.rt-flier .wing path:first-child,
.rt-flier .wing.far {
  fill: currentColor;
}
.rt-flier .wing.far {
  opacity: 0.45;
}
.rt-flier .belly {
  fill: #121820;
}
.rt-flier .wing .bar {
  fill: none;
  stroke: #121820;
  stroke-width: 1.3;
  stroke-linecap: round;
}
.rt-flier .wing.near,
.rt-flier .wing.far {
  -webkit-transform-origin: -12px -2px;
  transform-origin: -12px -2px;
  -webkit-animation: rtflap 0.42s ease-in-out infinite;
  animation: rtflap 0.42s ease-in-out infinite;
}
.rt-flier .wing.far {
  -webkit-animation-duration: 0.48s;
  animation-duration: 0.48s;
}
@-webkit-keyframes rtflap {
  0%, 100% { -webkit-transform: rotate(0deg); }
  55% { -webkit-transform: rotate(-28deg); }
}
@keyframes rtflap {
  0%, 100% { transform: rotate(0deg); }
  55% { transform: rotate(-28deg); }
}
</style>
</head>
<body>
<header>
  <h1>Magpie Routing</h1>
  <div id="meta">loading…</div>
</header>
<div id="stage">
  <svg id="trails" aria-hidden="true"></svg>
  <div id="agents"></div>
  <div id="hub">
    <div>
      <div class="hub-mark">Magpie</div>
      <div class="hub-sub">routing stage</div>
    </div>
  </div>
  <div id="models"></div>
  <div id="flier" aria-hidden="true">
    <div id="flierFace">
      <svg viewBox="-40 -30 80 50" width="96" height="48" role="img" aria-label="pigeon">
        <!-- Original artwork for magpie-route-dash (MIT); Magpie-inspired, not copied from Magpie.app -->
        <g class="rt-flier">
          <g class="rt-lift"><g transform="translate(0 2) scale(1.15)">
            <path class="wing far" d="M-8 -2 C-12 -10 -6 -16 2 -14 C-2 -8 -4 -4 -6 -1 Z"/>
            <path class="tail" d="M-22 2 L-10 -1 L-9 2 L-21 5 Z"/>
            <ellipse class="body" cx="-6" cy="0" rx="9" ry="4.5"/>
            <ellipse class="belly" cx="-7" cy="1.5" rx="5" ry="2"/>
            <circle class="body" cx="4" cy="-2.5" r="3.6"/>
            <path class="body" d="M7 -4.2 L14 -2.2 L7 -0.4 Z"/>
            <g class="wing near">
              <path d="M-7 -1 C-11 -9 -5 -15 3 -12 C-1 -7 -3 -3 -5 0 Z"/>
              <path class="bar" d="M-6 -3 C-9 -8 -6 -12 -1 -11"/>
            </g>
          </g></g>
        </g>
      </svg>
      <div id="berry"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var REFRESH_MS = 800;
  var FLY_MS = 1000;
  var PERCH_MS = 450;
  var BIRD_W = 96;
  var BIRD_H = 48;
  var STEP_MS = 40;
  var MAX_TRAILS = 4;
  var TRAIL_FADE_MS = 1500;
  var AGENT_TTL_MS = 300000;

  var meta = document.getElementById("meta");
  var stage = document.getElementById("stage");
  var agentsEl = document.getElementById("agents");
  var modelsEl = document.getElementById("models");
  var hubEl = document.getElementById("hub");
  var trailsEl = document.getElementById("trails");
  var flier = document.getElementById("flier");
  var flierFace = document.getElementById("flierFace");
  var berry = document.getElementById("berry");

  var seenRids = {};
  var firstLoad = true;
  var agentOrder = [];
  var chipOrder = [];
  var chipProv = {};
  var lastAgentKey = "";
  var lastChipKey = "";
  var liveState = {};
  var agentLastSeen = {};

  var flightQueue = [];
  var flying = false;
  var birdLeft = 0;
  var birdTop = 0;
  var birdPlaced = false;
  var boostTimer = null;
  var flightTimer = null;
  var animTimer = null;
  var activeTrails = [];
  var activeJob = null;
  var liveLinks = {};

  function pad(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function shortName(name, maxLen) {
    var s = String(name || "");
    var m = maxLen || 22;
    if (s.length <= m) return s;
    return s.slice(0, m - 1) + "…";
  }

  function ridOf(row) {
    if (row && row.id != null && row.id !== "") return "t" + row.id;
    if (row.rid != null && row.rid !== "") return "d" + row.rid;
    if (row.route_id != null && row.route_id !== "") return "r" + row.route_id;
    if (row.response_id) return "x" + row.response_id;
    return "x" + (row.t || "") + "|" + (row.agent || "") + "|" + (row.req || "") + "|" + (row.ms || "");
  }

  function agentOf(row) {
    return row.agentName || row.agent || "—";
  }

  function modelOf(row) {
    var tries, i, lastIncomplete, last;
    tries = row && row.tries;
    if (tries && tries.length) {
      lastIncomplete = null;
      for (i = 0; i < tries.length; i++) {
        if (tries[i] && tries[i].done === false) lastIncomplete = tries[i];
      }
      if (lastIncomplete && lastIncomplete.model) return lastIncomplete.model;
      last = tries[tries.length - 1];
      if (last && last.model) return last.model;
      if (tries[0] && tries[0].model) return tries[0].model;
    }
    return (row && (row.served || row.model)) || "";
  }

  function touchAgent(name) {
    if (!name || name === "—") return;
    agentLastSeen[name] = Date.now();
    if (indexOf(agentOrder, name) === -1) agentOrder.push(name);
  }

  function routeIsRecent(row) {
    var t, ms, now;
    if (!row) return false;
    if (row.done === false) return true;
    t = row.time || row.t || "";
    if (!t) return false;
    ms = Date.parse(String(t));
    if (isNaN(ms)) return false;
    now = Date.now();
    return (now - ms) <= AGENT_TTL_MS;
  }

  function ensureModel(model, prov) {
    if (!model) return;
    if (indexOf(chipOrder, model) === -1) {
      chipOrder.push(model);
      chipProv[model] = prov || "";
    } else if (prov) {
      chipProv[model] = prov;
    }
  }

  function agentIsBusy(name) {
    var rid, st, i, job;
    if (!name) return false;
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (!st) continue;
      if (st.agent === name && (st.phase === "out" || st.phase === "perch" || st.phase === "back")) {
        return true;
      }
    }
    if (activeJob && activeJob.agent === name) return true;
    for (i = 0; i < flightQueue.length; i++) {
      job = flightQueue[i];
      if (job && job.agent === name) return true;
    }
    return false;
  }

  function pruneAgents() {
    var now = Date.now();
    var kept = [];
    var i, name, seenAt;
    for (i = 0; i < agentOrder.length; i++) {
      name = agentOrder[i];
      if (agentIsBusy(name)) {
        kept.push(name);
        continue;
      }
      seenAt = agentLastSeen[name] || 0;
      if (now - seenAt <= AGENT_TTL_MS) kept.push(name);
      else delete agentLastSeen[name];
    }
    agentOrder = kept;
  }

  function countInflight() {
    var n = 0;
    var rid, st;
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (st && (st.phase === "out" || st.phase === "perch" || st.phase === "back")) n += 1;
    }
    return n;
  }

  function indexOf(arr, name) {
    var i;
    for (i = 0; i < arr.length; i++) {
      if (arr[i] === name) return i;
    }
    return -1;
  }

  function hashHue(str) {
    var s = String(str || "");
    var h = 0;
    var i;
    for (i = 0; i < s.length; i++) {
      h = ((h << 5) - h) + s.charCodeAt(i);
      h = h & h;
    }
    return Math.abs(h) % 360;
  }

  function setMeta(ok, extra) {
    var ts = new Date();
    var clock = pad(ts.getHours()) + ":" + pad(ts.getMinutes()) + ":" + pad(ts.getSeconds());
    if (ok) {
      meta.innerHTML = '<span class="ok">● live</span> · refreshed ' + clock + (extra ? " · " + esc(extra) : "");
    } else {
      meta.innerHTML = '<span class="bad">● offline</span> · ' + clock + (extra ? " · " + esc(extra) : "");
    }
  }

  function setFace(dir) {
    if (!flierFace) return;
    if (dir < 0) {
      flierFace.style.webkitTransform = "scaleX(-1)";
      flierFace.style.transform = "scaleX(-1)";
    } else {
      flierFace.style.webkitTransform = "scaleX(1)";
      flierFace.style.transform = "scaleX(1)";
    }
  }

  function boostWings() {
    if (!flier) return;
    var cls = flier.className || "";
    if (cls.indexOf("boost") === -1) {
      flier.className = cls + (cls ? " " : "") + "boost";
    }
    if (boostTimer) clearTimeout(boostTimer);
    boostTimer = setTimeout(function () {
      flier.className = (flier.className || "").replace(/\s*boost\b/g, "").replace(/^\s+|\s+$/g, "");
      boostTimer = null;
    }, 900);
  }

  function showBerry(hue) {
    if (!berry) return;
    berry.style.background = "hsl(" + hue + ", 72%, 58%)";
    berry.style.display = "block";
  }

  function hideBerry() {
    if (!berry) return;
    berry.style.display = "none";
  }

  function clearOns() {
    var cells, i;
    cells = agentsEl.getElementsByClassName("agent-cell");
    for (i = 0; i < cells.length; i++) {
      cells[i].className = "agent-cell";
    }
    cells = modelsEl.getElementsByClassName("model-cell");
    for (i = 0; i < cells.length; i++) {
      cells[i].className = "model-cell";
    }
  }

  function findAgentCell(name) {
    var cells = agentsEl.getElementsByClassName("agent-cell");
    var i;
    for (i = 0; i < cells.length; i++) {
      if ((cells[i].getAttribute("data-agent") || "") === name) return cells[i];
    }
    return cells.length ? cells[0] : null;
  }

  function findModelCell(name) {
    var cells = modelsEl.getElementsByClassName("model-cell");
    var i;
    for (i = 0; i < cells.length; i++) {
      if ((cells[i].getAttribute("data-model") || "") === name) return cells[i];
    }
    return cells.length ? cells[0] : null;
  }

  function cellCenter(cell) {
    var cellRect = cell.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    return {
      left: (cellRect.left - stageRect.left) + (cellRect.width / 2) - (BIRD_W / 2),
      top: (cellRect.top - stageRect.top) + (cellRect.height / 2) - (BIRD_H / 2)
    };
  }

  function perchOnNode(cell) {
    var cellRect, stageRect, inset;
    if (!cell) return null;
    cellRect = cell.getBoundingClientRect();
    stageRect = stage.getBoundingClientRect();
    inset = 4;
    return {
      left: (cellRect.left - stageRect.left) + inset,
      top: (cellRect.top - stageRect.top) + inset
    };
  }

  function placeBird(left, top, faceDir) {
    flier.style.visibility = "visible";
    if (faceDir != null) setFace(faceDir);
    else if (birdPlaced && Math.abs(left - birdLeft) > 2) setFace(left >= birdLeft ? 1 : -1);
    flier.style.left = left + "px";
    flier.style.top = top + "px";
    birdLeft = left;
    birdTop = top;
    birdPlaced = true;
  }

  function hubCenter() {
    var hubRect = hubEl.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    return {
      x: (hubRect.left - stageRect.left) + (hubRect.width / 2),
      y: (hubRect.top - stageRect.top) + (hubRect.height / 2)
    };
  }

  function birdCenterFromLeftTop(left, top) {
    return { x: left + (BIRD_W / 2), y: top + (BIRD_H / 2) };
  }

  function leftTopFromCenter(cx, cy) {
    return { left: cx - (BIRD_W / 2), top: cy - (BIRD_H / 2) };
  }

  function agentCurveOffset(agentName, outbound) {
    var idx = indexOf(agentOrder, agentName);
    var n = agentOrder.length || 1;
    if (idx < 0) idx = 0;
    var hue = hashHue(agentName);
    var jitter = ((hue % 17) - 8) * 3;
    var side = (idx - (n - 1) / 2) * 40 + jitter;
    if (!outbound) side = -side;
    var yOff = ((hue % 11) - 5) * 2;
    if (!outbound) yOff = -yOff;
    return { x: side, y: yOff };
  }

  function quadPoint(p0, p1, p2, t) {
    var u = 1 - t;
    return {
      x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
      y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y
    };
  }

  function buildCurve(fromC, hubC, toC, agentName, outbound) {
    var off = agentCurveOffset(agentName, outbound);
    var ctrl = {
      x: hubC.x + off.x,
      y: hubC.y + off.y
    };
    return { p0: fromC, p1: ctrl, p2: toC };
  }

  function syncTrailsSize() {
    if (!trailsEl) return;
    var w = stage.clientWidth;
    var h = stage.clientHeight;
    trailsEl.setAttribute("width", w);
    trailsEl.setAttribute("height", h);
    trailsEl.setAttribute("viewBox", "0 0 " + w + " " + h);
  }

  function pruneTrails() {
    while (activeTrails.length > MAX_TRAILS) {
      var old = activeTrails.shift();
      if (old && old.parentNode) old.parentNode.removeChild(old);
    }
  }

  function drawTrail(curve, hue) {
    if (!trailsEl) return null;
    syncTrailsSize();
    var d = "M " + curve.p0.x + " " + curve.p0.y +
      " Q " + curve.p1.x + " " + curve.p1.y +
      " " + curve.p2.x + " " + curve.p2.y;
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "hsl(" + hue + ", 70%, 60%)");
    path.setAttribute("stroke-width", "2.5");
    path.setAttribute("stroke-dasharray", "8 6");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("opacity", "0.55");
    trailsEl.appendChild(path);
    activeTrails.push(path);
    pruneTrails();
    setTimeout(function () {
      if (path.parentNode) path.parentNode.removeChild(path);
      var i;
      for (i = 0; i < activeTrails.length; i++) {
        if (activeTrails[i] === path) {
          activeTrails.splice(i, 1);
          break;
        }
      }
    }, TRAIL_FADE_MS);
    return path;
  }

  function clearLiveLink(rid) {
    var path;
    if (!rid || !liveLinks[rid]) return;
    path = liveLinks[rid];
    if (path && path.parentNode) path.parentNode.removeChild(path);
    delete liveLinks[rid];
  }

  function setLiveLink(rid, agent, model, hue) {
    var agentCell, modelCell, hubC, agentPos, modelPos, agentC, modelC, curve, d, path;
    if (!rid || !trailsEl) return;
    clearLiveLink(rid);
    agentCell = findAgentCell(agent);
    modelCell = findModelCell(model);
    if (!agentCell || !modelCell || !hubEl) return;
    syncTrailsSize();
    hubC = hubCenter();
    agentPos = cellCenter(agentCell);
    modelPos = cellCenter(modelCell);
    agentC = { x: agentPos.left + (BIRD_W / 2), y: agentPos.top + (BIRD_H / 2) };
    modelC = { x: modelPos.left + (BIRD_W / 2), y: modelPos.top + (BIRD_H / 2) };
    curve = buildCurve(agentC, hubC, modelC, agent, true);
    d = "M " + curve.p0.x + " " + curve.p0.y +
      " Q " + curve.p1.x + " " + curve.p1.y +
      " " + curve.p2.x + " " + curve.p2.y;
    path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "hsl(" + hue + ", 70%, 60%)");
    path.setAttribute("stroke-width", "2.5");
    path.setAttribute("stroke-dasharray", "8 6");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("opacity", "0.45");
    path.setAttribute("data-live-link", rid);
    trailsEl.appendChild(path);
    liveLinks[rid] = path;
  }

  function redrawLiveLinks() {
    var rid, st, keys, i;
    keys = [];
    for (rid in liveLinks) {
      if (liveLinks.hasOwnProperty(rid)) keys.push(rid);
    }
    for (i = 0; i < keys.length; i++) clearLiveLink(keys[i]);
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (st && (st.phase === "out" || st.phase === "perch")) {
        setLiveLink(rid, st.agent, st.model, hashHue(st.agent));
      }
    }
  }

  function snapPerchedBirds() {
    var rid, st, modelCell, perch;
    if (flying) return;
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (!st || st.phase !== "perch") continue;
      modelCell = findModelCell(st.model);
      if (!modelCell) continue;
      perch = perchOnNode(modelCell);
      if (perch) placeBird(perch.left, perch.top, null);
      return;
    }
  }

  function stopAnim() {
    if (animTimer) {
      clearInterval(animTimer);
      animTimer = null;
    }
  }

  function animateAlong(curve, durationMs, onDone) {
    stopAnim();
    var steps = Math.max(8, Math.round(durationMs / STEP_MS));
    var i = 0;
    var prev = curve.p0;
    var start = leftTopFromCenter(curve.p0.x, curve.p0.y);
    placeBird(start.left, start.top, null);

    animTimer = setInterval(function () {
      i += 1;
      var t = i / steps;
      if (t > 1) t = 1;
      var pt = quadPoint(curve.p0, curve.p1, curve.p2, t);
      var pos = leftTopFromCenter(pt.x, pt.y);
      var dx = pt.x - prev.x;
      if (Math.abs(dx) > 0.5) setFace(dx >= 0 ? 1 : -1);
      placeBird(pos.left, pos.top, null);
      prev = pt;
      if (t >= 1) {
        stopAnim();
        if (onDone) onDone();
      }
    }, STEP_MS);
  }

  function syncOrders(rows) {
    var i, row, agent, model, prov;
    for (i = 0; i < rows.length; i++) {
      row = rows[i] || {};
      agent = agentOf(row);
      // Only refresh agent TTL for in-flight or recent routes — not the whole ring buffer.
      if (routeIsRecent(row)) touchAgent(agent);
      model = modelOf(row);
      if (!model) continue;
      prov = row.providerName || row.provider || "";
      ensureModel(model, prov);
    }
  }

  function rebuildAgents() {
    var html = [];
    var i, name;
    for (i = 0; i < agentOrder.length; i++) {
      name = agentOrder[i];
      html.push(
        '<div class="agent-cell" data-agent="' + esc(name) + '">' +
          esc(shortName(name, 18)) +
        "</div>"
      );
    }
    agentsEl.innerHTML = html.join("");
  }

  function layoutModelGrid() {
    var N = chipOrder.length;
    var maxByWidth, cols, rem, alt, cells, i;
    if (!modelsEl) return;
    if (N < 1) {
      modelsEl.style.display = "";
      modelsEl.style.gridTemplateColumns = "";
      return;
    }
    maxByWidth = Math.max(1, Math.floor((modelsEl.clientWidth || stage.clientWidth || 320) / 140));
    cols = Math.ceil(Math.sqrt(N));
    rem = N % cols;
    if (rem && cols < N) {
      alt = cols + 1;
      if (alt <= maxByWidth && (N % alt === 0 || rem === 1)) {
        cols = alt;
      }
    }
    cols = Math.max(1, Math.min(N, cols, maxByWidth));
    modelsEl.style.display = "grid";
    modelsEl.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    modelsEl.style.gap = "10px";
    modelsEl.style.width = "100%";
    cells = modelsEl.getElementsByClassName("model-cell");
    for (i = 0; i < cells.length; i++) {
      cells[i].style.width = "auto";
      cells[i].style.float = "none";
      cells[i].style.margin = "0";
    }
  }

  function rebuildModels() {
    var html = [];
    var i, name, prov;
    for (i = 0; i < chipOrder.length; i++) {
      name = chipOrder[i];
      prov = chipProv[name] || "";
      html.push(
        '<div class="model-cell" data-model="' + esc(name) + '">' +
          '<span class="chip-name">' + esc(shortName(name, 20)) + "</span>" +
          (prov ? '<span class="chip-prov">' + esc(prov) + "</span>" : "") +
        "</div>"
      );
    }
    modelsEl.innerHTML = html.join("");
    layoutModelGrid();
  }

  function ensureDom() {
    var aKey = agentOrder.join("|");
    var cKey = chipOrder.join("|");
    var changed = false;
    if (aKey !== lastAgentKey) {
      rebuildAgents();
      lastAgentKey = aKey;
      changed = true;
    }
    if (cKey !== lastChipKey) {
      rebuildModels();
      lastChipKey = cKey;
      changed = true;
    }
    if (changed) {
      redrawLiveLinks();
      snapPerchedBirds();
    }
  }

  function markPair(agent, model) {
    var cells, i, name;
    cells = agentsEl.getElementsByClassName("agent-cell");
    for (i = 0; i < cells.length; i++) {
      name = cells[i].getAttribute("data-agent") || "";
      cells[i].className = name === agent ? "agent-cell on" : "agent-cell";
    }
    cells = modelsEl.getElementsByClassName("model-cell");
    for (i = 0; i < cells.length; i++) {
      name = cells[i].getAttribute("data-model") || "";
      cells[i].className = name === model ? "model-cell on" : "model-cell";
    }
    redrawLiveLinks();
  }

  function finishFlight() {
    activeJob = null;
    flying = false;
    maybeStartFlight();
  }

  function centersFor(job) {
    var agentCell = findAgentCell(job.agent);
    var modelCell = findModelCell(job.model);
    var agentC, modelC, hubC;
    if (!agentCell || !modelCell || !hubEl) return null;
    agentC = cellCenter(agentCell);
    modelC = cellCenter(modelCell);
    hubC = hubCenter();
    return {
      agentC: { x: agentC.left + (BIRD_W / 2), y: agentC.top + (BIRD_H / 2) },
      modelC: { x: modelC.left + (BIRD_W / 2), y: modelC.top + (BIRD_H / 2) },
      hubC: hubC
    };
  }

  function runOutbound(job, onLanded) {
    var pts = centersFor(job);
    var outCurve, outPath, modelCell, perch;
    if (!pts) {
      if (onLanded) onLanded(false);
      finishFlight();
      return;
    }
    markPair(job.agent, job.model);
    if (job.rid) setLiveLink(job.rid, job.agent, job.model, job.hue);
    outCurve = buildCurve(pts.agentC, pts.hubC, pts.modelC, job.agent, true);
    outPath = drawTrail(outCurve, job.hue);
    showBerry(job.hue);
    boostWings();
    if (flightTimer) clearTimeout(flightTimer);
    flightTimer = null;
    animateAlong(outCurve, FLY_MS, function () {
      boostWings();
      if (outPath) outPath.setAttribute("opacity", "0.18");
      modelCell = findModelCell(job.model);
      if (modelCell) {
        perch = perchOnNode(modelCell);
        if (perch) placeBird(perch.left, perch.top, null);
      }
      markPair(job.agent, job.model);
      if (onLanded) onLanded(true);
      finishFlight();
    });
  }

  function runReturn(job, onDone) {
    var pts = centersFor(job);
    var backCurve, agentCell, perch;
    if (!pts) {
      if (job.rid) clearLiveLink(job.rid);
      clearOns();
      hideBerry();
      if (onDone) onDone(false);
      finishFlight();
      return;
    }
    markPair(job.agent, job.model);
    hideBerry();
    boostWings();
    if (flightTimer) clearTimeout(flightTimer);
    flightTimer = null;
    backCurve = buildCurve(pts.modelC, pts.hubC, pts.agentC, job.agent, false);
    drawTrail(backCurve, job.hue);
    animateAlong(backCurve, FLY_MS, function () {
      agentCell = findAgentCell(job.agent);
      if (agentCell) {
        perch = perchOnNode(agentCell);
        if (perch) placeBird(perch.left, perch.top, null);
      }
      flightTimer = setTimeout(function () {
        flightTimer = null;
        if (job.rid) clearLiveLink(job.rid);
        clearOns();
        hideBerry();
        if (onDone) onDone(true);
        finishFlight();
      }, 40);
    });
  }

  function runFlight(job) {
    var rid = job.rid;
    var st;
    if (job.leg === "back") {
      if (rid && liveState[rid]) liveState[rid].phase = "back";
      runReturn(job, function () {
        if (rid) clearLiveLink(rid);
        if (rid && liveState[rid]) {
          liveState[rid].phase = "done";
          delete liveState[rid];
        }
      });
      return;
    }
    if (rid && liveState[rid]) liveState[rid].phase = "out";
    if (rid) setLiveLink(rid, job.agent, job.model, job.hue);
    runOutbound(job, function (ok) {
      st = rid ? liveState[rid] : null;
      if (!st) {
        if (rid) clearLiveLink(rid);
        return;
      }
      if (!ok) {
        clearLiveLink(rid);
        delete liveState[rid];
        return;
      }
      if (st.pendingReturn) {
        st.pendingReturn = false;
        st.phase = "perch";
        enqueueReturn(st.agent, st.model, rid);
      } else {
        st.phase = "perch";
        markPair(st.agent, st.model);
      }
    });
  }

  function maybeStartFlight() {
    var job;
    if (flying) return;
    if (!flightQueue.length) return;
    job = flightQueue.shift();
    flying = true;
    activeJob = job;
    runFlight(job);
  }

  function enqueueOutbound(agent, model, rid) {
    if (!agent || !model) return;
    flightQueue.push({
      agent: agent,
      model: model,
      hue: hashHue(agent),
      leg: "out",
      rid: rid
    });
    maybeStartFlight();
  }

  function enqueueReturn(agent, model, rid) {
    var i, job;
    if (!agent || !model) return;
    for (i = 0; i < flightQueue.length; i++) {
      job = flightQueue[i];
      if (job && job.rid === rid && job.leg === "back") return;
    }
    if (activeJob && activeJob.rid === rid && activeJob.leg === "back") return;
    flightQueue.push({
      agent: agent,
      model: model,
      hue: hashHue(agent),
      leg: "back",
      rid: rid
    });
    maybeStartFlight();
  }

  function startReturnFor(rid) {
    var st = liveState[rid];
    if (!st) return;
    if (st.phase === "done" || st.phase === "back") return;
    if (st.phase === "seed") {
      st.phase = "done";
      delete liveState[rid];
      return;
    }
    if (st.phase === "out") {
      st.pendingReturn = true;
      return;
    }
    if (st.phase === "perch") {
      enqueueReturn(st.agent, st.model, rid);
    }
  }

  function processLive(routes) {
    var i, row, rid, agent, model, done, present;
    var list = routes || [];
    var current = {};

    syncOrders(list);

    if (firstLoad) {
      for (i = 0; i < list.length; i++) {
        row = list[i] || {};
        rid = ridOf(row);
        seenRids[rid] = true;
        liveState[rid] = {
          phase: row.done === false ? "seed" : "done",
          agent: agentOf(row),
          model: modelOf(row),
          pendingReturn: false
        };
        if (row.done !== false) delete liveState[rid];
      }
      pruneAgents();
      ensureDom();
      firstLoad = false;
      return;
    }

    for (i = 0; i < list.length; i++) {
      row = list[i] || {};
      rid = ridOf(row);
      current[rid] = true;
      agent = agentOf(row);
      model = modelOf(row);
      done = row.done !== false;
      // agent TTL / order: syncOrders already touched recent/in-flight
      ensureModel(model, row.providerName || row.provider || "");

      if (!seenRids[rid]) {
        seenRids[rid] = true;
        if (done) {
          continue;
        }
        liveState[rid] = {
          phase: "out",
          agent: agent,
          model: model,
          pendingReturn: false
        };
        ensureDom();
        enqueueOutbound(agent, model, rid);
        continue;
      }

      if (liveState[rid]) {
        if (agent) liveState[rid].agent = agent;
        if (model) liveState[rid].model = model;
        if (done) startReturnFor(rid);
      }
    }

    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      if (current[rid]) continue;
      present = liveState[rid];
      if (!present) continue;
      if (present.phase === "out" || present.phase === "perch" || present.phase === "seed") {
        startReturnFor(rid);
      }
    }

    pruneAgents();
    ensureDom();
    redrawLiveLinks();
    snapPerchedBirds();
  }

  function tick() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/live", true);
    xhr.timeout = 8000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        var data;
        try {
          data = JSON.parse(xhr.responseText);
        } catch (e) {
          setMeta(false, "bad json");
          return;
        }
        var routes = (data && data.routes) ? data.routes : [];
        var inflight = 0;
        var j;
        for (j = 0; j < routes.length; j++) {
          if (routes[j] && routes[j].done === false) inflight += 1;
        }
        processLive(routes);
        setMeta(
          true,
          "in " + inflight +
            " · live " + countInflight() +
            " · q " + flightQueue.length +
            (flying ? " · flying" : "")
        );
      } else {
        setMeta(false, "http " + xhr.status);
      }
    };
    xhr.ontimeout = function () {
      setMeta(false, "timeout");
    };
    xhr.onerror = function () {
      setMeta(false, "network");
    };
    xhr.send(null);
  }

  function onResize() {
    var rid, st, modelCell, perch, found;
    var stageRect, left, hub, top, hubRect;
    layoutModelGrid();
    redrawLiveLinks();
    if (flying) return;
    found = false;
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (!st || st.phase !== "perch") continue;
      modelCell = findModelCell(st.model);
      if (!modelCell) continue;
      perch = perchOnNode(modelCell);
      if (perch) {
        placeBird(perch.left, perch.top, null);
        found = true;
        break;
      }
    }
    if (found) return;
    if (!birdPlaced) return;
    // Snap bird near hub center when idle.
    stageRect = stage.getBoundingClientRect();
    left = (stage.clientWidth / 2) - (BIRD_W / 2);
    hub = document.getElementById("hub");
    top = 80;
    if (hub) {
      hubRect = hub.getBoundingClientRect();
      top = (hubRect.top - stageRect.top) + (hubRect.height / 2) - (BIRD_H / 2);
    }
    placeBird(left, top, 1);
  }

  if (window.addEventListener) {
    window.addEventListener("resize", onResize, false);
  } else if (window.attachEvent) {
    window.attachEvent("onresize", onResize);
  }

  tick();
  setInterval(tick, REFRESH_MS);
})();
</script>
</body>
</html>
