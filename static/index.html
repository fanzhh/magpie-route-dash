<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Magpie Routing</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0b0f14;
  color: #e8eef5;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 22px;
  -webkit-text-size-adjust: 100%;
}
header {
  padding: 14px 18px 8px;
  background: #121820;
  border-bottom: 1px solid #243041;
}
h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.2px;
}
#meta {
  margin-top: 6px;
  font-size: 17px;
  color: #9aa8b8;
}
#meta .ok { color: #5dde8a; }
#meta .bad { color: #ff6b6b; }
#stage {
  position: relative;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  flex-direction: column;
  min-height: calc(100vh - 88px);
  padding: 18px 16px 28px;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  overflow: hidden;
  background: -webkit-linear-gradient(top, #15202b 0%, #0b0f14 55%, #101820 100%);
  background: linear-gradient(to bottom, #15202b 0%, #0b0f14 55%, #101820 100%);
}
#agents {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  gap: 28px;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  min-height: 72px;
  padding-top: 48px;
  margin-bottom: 24px;
}
.agent-cell {
  display: block;
  float: left;
  min-width: 120px;
  max-width: 220px;
  margin: 0 16px 16px 0;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #2a3a4c;
  background: #182230;
  color: #d5e0ea;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
@supports (display: flex) or (display: grid) {
  .agent-cell {
    float: none;
    margin: 0;
  }
}
.agent-cell.on {
  border-color: #5dde8a;
  background: #1a3a28;
  color: #e8eef5;
  -webkit-box-shadow: 0 0 14px rgba(93, 222, 138, 0.35);
  box-shadow: 0 0 14px rgba(93, 222, 138, 0.35);
}
#hub {
  -webkit-box-flex: 0;
  -webkit-flex: 0 0 auto;
  flex: 0 0 auto;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  min-height: 72px;
  padding: 32px 0;
  text-align: center;
}
#hub .hub-mark {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #e8eef5;
  text-shadow: 0 0 28px rgba(93, 222, 138, 0.25);
}
#hub .hub-sub {
  margin-top: 2px;
  font-size: 13px;
  color: #7f8c9b;
  letter-spacing: 2px;
  text-transform: uppercase;
}
#trails {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 15;
  pointer-events: none;
  overflow: visible;
}
#models {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  gap: 24px;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  width: 100%;
  min-height: 88px;
  margin-top: 24px;
}
.model-cell {
  display: block;
  float: left;
  width: auto;
  margin: 0 16px 16px 0;
  padding: 12px 14px;
  min-height: 70px;
  border-radius: 12px;
  border: 1px solid #2a3a4c;
  background: #182230;
  color: #c8d4e0;
  font-size: 17px;
  line-height: 1.25;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}
@supports (display: flex) or (display: grid) {
  .model-cell {
    float: none;
    width: auto;
    margin: 0;
  }
}
.model-cell .chip-name {
  display: block;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-cell .chip-prov {
  display: block;
  margin-top: 4px;
  font-size: 13px;
  color: #7f8c9b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.model-cell.on {
  border-color: #5dde8a;
  background: #1a3a28;
  color: #e8eef5;
  -webkit-box-shadow: 0 0 14px rgba(93, 222, 138, 0.35);
  box-shadow: 0 0 14px rgba(93, 222, 138, 0.35);
}
#flier,
.flier {
  position: absolute;
  top: 0;
  left: 0;
  width: 96px;
  height: 48px;
  color: #c8d4e0;
  z-index: 30;
  pointer-events: none;
  visibility: hidden;
}
.flier.boost .rt-flier .wing.near,
.flier.boost .rt-flier .wing.far {
  -webkit-animation-duration: 0.22s;
  animation-duration: 0.22s;
}
.flier-face {
  position: relative;
  width: 100%;
  height: 100%;
  -webkit-transform-origin: 50% 50%;
  transform-origin: 50% 50%;
}
.berry {
  position: absolute;
  left: 58px;
  top: 18px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #ff6b6b;
  border: 2px solid #0b0f14;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  display: none;
  z-index: 2;
}
.rt-flier .body,
.rt-flier .tail,
.rt-flier .wing path:first-child,
.rt-flier .wing.far {
  fill: currentColor;
}
.rt-flier .wing.far {
  opacity: 0.45;
}
.rt-flier .belly {
  fill: #121820;
}
.rt-flier .wing .bar {
  fill: none;
  stroke: #121820;
  stroke-width: 1.3;
  stroke-linecap: round;
}
.rt-flier .wing.near,
.rt-flier .wing.far {
  -webkit-transform-origin: -12px -2px;
  transform-origin: -12px -2px;
  -webkit-animation: rtflap 0.42s ease-in-out infinite;
  animation: rtflap 0.42s ease-in-out infinite;
}
.rt-flier .wing.far {
  -webkit-animation-duration: 0.48s;
  animation-duration: 0.48s;
}
@-webkit-keyframes rtflap {
  0%, 100% { -webkit-transform: rotate(0deg); }
  55% { -webkit-transform: rotate(-28deg); }
}
@keyframes rtflap {
  0%, 100% { transform: rotate(0deg); }
  55% { transform: rotate(-28deg); }
}
</style>
</head>
<body>
<header>
  <h1>Magpie Routing</h1>
  <div id="meta">loading…</div>
</header>
<div id="stage">
  <svg id="trails" aria-hidden="true"></svg>
  <div id="agents"></div>
  <div id="hub">
    <div>
      <div class="hub-mark">Magpie</div>
      <div class="hub-sub">routing stage</div>
    </div>
  </div>
  <div id="models"></div>
  <div id="flier" aria-hidden="true">
    <div id="flierFace" class="flier-face">
      <svg viewBox="-40 -30 80 50" width="96" height="48" role="img" aria-label="pigeon">
        <!-- Original artwork for magpie-route-dash (MIT); Magpie-inspired, not copied from Magpie.app -->
        <g class="rt-flier">
          <g class="rt-lift"><g transform="translate(0 2) scale(1.15)">
            <path class="wing far" d="M-8 -2 C-12 -10 -6 -16 2 -14 C-2 -8 -4 -4 -6 -1 Z"/>
            <path class="tail" d="M-22 2 L-10 -1 L-9 2 L-21 5 Z"/>
            <ellipse class="body" cx="-6" cy="0" rx="9" ry="4.5"/>
            <ellipse class="belly" cx="-7" cy="1.5" rx="5" ry="2"/>
            <circle class="body" cx="4" cy="-2.5" r="3.6"/>
            <path class="body" d="M7 -4.2 L14 -2.2 L7 -0.4 Z"/>
            <g class="wing near">
              <path d="M-7 -1 C-11 -9 -5 -15 3 -12 C-1 -7 -3 -3 -5 0 Z"/>
              <path class="bar" d="M-6 -3 C-9 -8 -6 -12 -1 -11"/>
            </g>
          </g></g>
        </g>
      </svg>
      <div id="berry" class="berry"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var REFRESH_MS = 800;
  var FLY_MS = 1000;
  var PERCH_MS = 450;
  var BIRD_W = 96;
  var BIRD_H = 48;
  var STEP_MS = 40;
  var MAX_TRAILS = 12;
  var TRAIL_FADE_MS = 1500;
  var AGENT_TTL_MS = 300000;

  var meta = document.getElementById("meta");
  var stage = document.getElementById("stage");
  var agentsEl = document.getElementById("agents");
  var modelsEl = document.getElementById("models");
  var hubEl = document.getElementById("hub");
  var trailsEl = document.getElementById("trails");
  var flierTemplate = document.getElementById("flier");

  var seenRids = {};
  var firstLoad = true;
  var agentOrder = [];
  var chipOrder = [];
  var chipProv = {};
  var lastAgentKey = "";
  var lastChipKey = "";
  var liveState = {};
  var agentLastSeen = {};

  var fliers = {};
  var flyingCount = 0;
  var idleRec = null;
  var activeTrails = [];
  var liveLinks = {};

  function pad(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function shortName(name, maxLen) {
    var s = String(name || "");
    var m = maxLen || 22;
    if (s.length <= m) return s;
    return s.slice(0, m - 1) + "…";
  }

  function ridOf(row) {
    if (row && row.id != null && row.id !== "") return "t" + row.id;
    if (row.rid != null && row.rid !== "") return "d" + row.rid;
    if (row.route_id != null && row.route_id !== "") return "r" + row.route_id;
    if (row.response_id) return "x" + row.response_id;
    return "x" + (row.t || "") + "|" + (row.agent || "") + "|" + (row.req || "") + "|" + (row.ms || "");
  }

  function agentOf(row) {
    return row.agentName || row.agent || "—";
  }

  function modelOf(row) {
    var tries, i, lastIncomplete, last;
    tries = row && row.tries;
    if (tries && tries.length) {
      lastIncomplete = null;
      for (i = 0; i < tries.length; i++) {
        if (tries[i] && tries[i].done === false) lastIncomplete = tries[i];
      }
      if (lastIncomplete && lastIncomplete.model) return lastIncomplete.model;
      last = tries[tries.length - 1];
      if (last && last.model) return last.model;
      if (tries[0] && tries[0].model) return tries[0].model;
    }
    return (row && (row.served || row.model)) || "";
  }

  function touchAgent(name) {
    if (!name || name === "—") return;
    agentLastSeen[name] = Date.now();
    if (indexOf(agentOrder, name) === -1) agentOrder.push(name);
  }

  function routeIsRecent(row) {
    var t, ms, now;
    if (!row) return false;
    if (row.done === false) return true;
    t = row.time || row.t || "";
    if (!t) return false;
    ms = Date.parse(String(t));
    if (isNaN(ms)) return false;
    now = Date.now();
    return (now - ms) <= AGENT_TTL_MS;
  }

  function ensureModel(model, prov) {
    if (!model) return;
    if (indexOf(chipOrder, model) === -1) {
      chipOrder.push(model);
      chipProv[model] = prov || "";
    } else if (prov) {
      chipProv[model] = prov;
    }
  }

  function agentIsBusy(name) {
    var rid, st;
    if (!name) return false;
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (!st) continue;
      if (st.agent === name && (st.phase === "out" || st.phase === "perch" || st.phase === "back")) {
        return true;
      }
    }
    return false;
  }

  function pruneAgents() {
    var now = Date.now();
    var kept = [];
    var i, name, seenAt;
    for (i = 0; i < agentOrder.length; i++) {
      name = agentOrder[i];
      if (agentIsBusy(name)) {
        kept.push(name);
        continue;
      }
      seenAt = agentLastSeen[name] || 0;
      if (now - seenAt <= AGENT_TTL_MS) kept.push(name);
      else delete agentLastSeen[name];
    }
    agentOrder = kept;
  }

  function countInflight() {
    var n = 0;
    var rid, st;
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (st && (st.phase === "out" || st.phase === "perch" || st.phase === "back")) n += 1;
    }
    return n;
  }

  function indexOf(arr, name) {
    var i;
    for (i = 0; i < arr.length; i++) {
      if (arr[i] === name) return i;
    }
    return -1;
  }

  function hashHue(str) {
    var s = String(str || "");
    var h = 0;
    var i;
    for (i = 0; i < s.length; i++) {
      h = ((h << 5) - h) + s.charCodeAt(i);
      h = h & h;
    }
    return Math.abs(h) % 360;
  }

  function setMeta(ok, extra) {
    var ts = new Date();
    var clock = pad(ts.getHours()) + ":" + pad(ts.getMinutes()) + ":" + pad(ts.getSeconds());
    if (ok) {
      meta.innerHTML = '<span class="ok">● live</span> · refreshed ' + clock + (extra ? " · " + esc(extra) : "");
    } else {
      meta.innerHTML = '<span class="bad">● offline</span> · ' + clock + (extra ? " · " + esc(extra) : "");
    }
  }

  function flierHasClass(el, cls) {
    return !!(el && el.className && String(el.className).indexOf(cls) !== -1);
  }

  function createFlierRecord(rid, hue) {
    var el, faces, face, ber, i, d;
    el = flierTemplate.cloneNode(true);
    if (el.removeAttribute) el.removeAttribute("id");
    el.className = "flier";
    el.style.visibility = "hidden";
    el.style.color = "hsl(" + hue + ", 55%, 72%)";
    faces = el.getElementsByTagName("div");
    face = null;
    ber = null;
    for (i = 0; i < faces.length; i++) {
      d = faces[i];
      if (flierHasClass(d, "flier-face")) {
        if (d.removeAttribute) d.removeAttribute("id");
        face = d;
      } else if (flierHasClass(d, "berry")) {
        if (d.removeAttribute) d.removeAttribute("id");
        ber = d;
      }
    }
    stage.appendChild(el);
    return {
      rid: rid,
      el: el,
      face: face,
      berry: ber,
      hue: hue,
      left: 0,
      top: 0,
      hasPos: false,
      animTimer: null,
      boostTimer: null
    };
  }

  function ensureFlier(rid, hue) {
    var rec = fliers[rid];
    if (!rec) {
      rec = createFlierRecord(rid, hue);
      fliers[rid] = rec;
    }
    return rec;
  }

  function stopFlierAnim(rec) {
    if (rec && rec.animTimer) {
      clearInterval(rec.animTimer);
      rec.animTimer = null;
    }
  }

  function destroyFlier(rid) {
    var rec = fliers[rid];
    if (!rec) return;
    stopFlierAnim(rec);
    if (rec.boostTimer) { clearTimeout(rec.boostTimer); rec.boostTimer = null; }
    if (rec.el && rec.el.parentNode) rec.el.parentNode.removeChild(rec.el);
    delete fliers[rid];
  }

  function hasLiveFlier() {
    var rid;
    for (rid in fliers) {
      if (fliers.hasOwnProperty(rid)) return true;
    }
    return false;
  }

  function setFaceOn(rec, dir) {
    if (!rec || !rec.face) return;
    if (dir < 0) {
      rec.face.style.webkitTransform = "scaleX(-1)";
      rec.face.style.transform = "scaleX(-1)";
    } else {
      rec.face.style.webkitTransform = "scaleX(1)";
      rec.face.style.transform = "scaleX(1)";
    }
  }

  function placeBirdOn(rec, left, top, faceDir) {
    if (!rec || !rec.el) return;
    rec.el.style.visibility = "visible";
    if (faceDir != null) setFaceOn(rec, faceDir);
    else if (rec.hasPos && Math.abs(left - rec.left) > 2) setFaceOn(rec, left >= rec.left ? 1 : -1);
    rec.el.style.left = left + "px";
    rec.el.style.top = top + "px";
    rec.left = left;
    rec.top = top;
    rec.hasPos = true;
  }

  function boostWingsOn(rec) {
    var cls;
    if (!rec || !rec.el) return;
    cls = rec.el.className || "";
    if (cls.indexOf("boost") === -1) {
      rec.el.className = cls + (cls ? " " : "") + "boost";
    }
    if (rec.boostTimer) clearTimeout(rec.boostTimer);
    rec.boostTimer = setTimeout(function () {
      rec.el.className = (rec.el.className || "").replace(/\s*boost\b/g, "").replace(/^\s+|\s+$/g, "");
      rec.boostTimer = null;
    }, 900);
  }

  function showBerryOn(rec, hue) {
    if (!rec || !rec.berry) return;
    rec.berry.style.background = "hsl(" + (hue || rec.hue) + ", 72%, 58%)";
    rec.berry.style.display = "block";
  }

  function hideBerryOn(rec) {
    if (!rec || !rec.berry) return;
    rec.berry.style.display = "none";
  }

  function refreshHighlights() {
    var rid, st, agentsOn, modelsOn, cells, i, name;
    agentsOn = {};
    modelsOn = {};
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (!st) continue;
      if (st.agent) agentsOn[st.agent] = true;
      if (st.model) modelsOn[st.model] = true;
    }
    cells = agentsEl.getElementsByClassName("agent-cell");
    for (i = 0; i < cells.length; i++) {
      name = cells[i].getAttribute("data-agent") || "";
      cells[i].className = agentsOn[name] ? "agent-cell on" : "agent-cell";
    }
    cells = modelsEl.getElementsByClassName("model-cell");
    for (i = 0; i < cells.length; i++) {
      name = cells[i].getAttribute("data-model") || "";
      cells[i].className = modelsOn[name] ? "model-cell on" : "model-cell";
    }
    redrawLiveLinks();
  }

  function findAgentCell(name) {
    var cells = agentsEl.getElementsByClassName("agent-cell");
    var i;
    for (i = 0; i < cells.length; i++) {
      if ((cells[i].getAttribute("data-agent") || "") === name) return cells[i];
    }
    return cells.length ? cells[0] : null;
  }

  function findModelCell(name) {
    var cells = modelsEl.getElementsByClassName("model-cell");
    var i;
    for (i = 0; i < cells.length; i++) {
      if ((cells[i].getAttribute("data-model") || "") === name) return cells[i];
    }
    return cells.length ? cells[0] : null;
  }

  function cellCenter(cell) {
    var cellRect = cell.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    return {
      left: (cellRect.left - stageRect.left) + (cellRect.width / 2) - (BIRD_W / 2),
      top: (cellRect.top - stageRect.top) + (cellRect.height / 2) - (BIRD_H / 2)
    };
  }

  function perchOnNode(cell) {
    var cellRect, stageRect, FEET_OVERLAP, left, top, faceDir;
    var cellCenterX, stageCenterX;
    if (!cell) return null;
    cellRect = cell.getBoundingClientRect();
    stageRect = stage.getBoundingClientRect();
    FEET_OVERLAP = 10; // tune 8-14 so feet rest on top edge of rounded border
    cellCenterX = cellRect.left + (cellRect.width / 2);
    stageCenterX = stageRect.left + (stageRect.width / 2);
    // Prefer inward corner toward stage/hub center; face toward node center.
    if (cellCenterX < stageCenterX) {
      // cell is left of center → perch on RIGHT corner, face left (-1)
      left = (cellRect.left - stageRect.left) + cellRect.width - BIRD_W - 4;
      faceDir = -1;
    } else {
      // cell is right of (or at) center → perch on LEFT corner, face right (+1)
      left = (cellRect.left - stageRect.left) + 4;
      faceDir = 1;
    }
    top = (cellRect.top - stageRect.top) - BIRD_H + FEET_OVERLAP; // feet on top border
    if (top < 0) top = 0;
    return {
      left: left,
      top: top,
      face: faceDir
    };
  }

  function birdNodeCenter(cell) {
    var perch, c;
    if (!cell) return null;
    perch = perchOnNode(cell);
    if (perch) return { x: perch.left + (BIRD_W / 2), y: perch.top + (BIRD_H / 2) };
    c = cellCenter(cell);
    return { x: c.left + (BIRD_W / 2), y: c.top + (BIRD_H / 2) };
  }

  function agentBorderPoint(cell) {
    var cellRect, stageRect;
    if (!cell) return null;
    cellRect = cell.getBoundingClientRect();
    stageRect = stage.getBoundingClientRect();
    return {
      x: cellRect.right - stageRect.left,
      y: (cellRect.top - stageRect.top) + (cellRect.height / 2)
    };
  }

  function flierCenter(rid, model) {
    var rec = fliers[rid];
    var modelCell, perch;
    if (rec && rec.hasPos) {
      return { x: rec.left + (BIRD_W / 2), y: rec.top + (BIRD_H / 2) };
    }
    modelCell = model ? findModelCell(model) : null;
    perch = modelCell ? perchOnNode(modelCell) : null;
    if (perch) return { x: perch.left + (BIRD_W / 2), y: perch.top + (BIRD_H / 2) };
    return null;
  }

  function hubCenter() {
    var hubRect = hubEl.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    return {
      x: (hubRect.left - stageRect.left) + (hubRect.width / 2),
      y: (hubRect.top - stageRect.top) + (hubRect.height / 2)
    };
  }

  function leftTopFromCenter(cx, cy) {
    return { left: cx - (BIRD_W / 2), top: cy - (BIRD_H / 2) };
  }

  function agentCurveOffset(agentName, outbound) {
    var idx = indexOf(agentOrder, agentName);
    var n = agentOrder.length || 1;
    if (idx < 0) idx = 0;
    var hue = hashHue(agentName);
    var jitter = ((hue % 17) - 8) * 3;
    var side = (idx - (n - 1) / 2) * 40 + jitter;
    if (!outbound) side = -side;
    var yOff = ((hue % 11) - 5) * 2;
    if (!outbound) yOff = -yOff;
    return { x: side, y: yOff };
  }

  function quadPoint(p0, p1, p2, t) {
    var u = 1 - t;
    return {
      x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
      y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y
    };
  }

  function buildCurve(fromC, hubC, toC, agentName, outbound) {
    var off = agentCurveOffset(agentName, outbound);
    var ctrl = {
      x: hubC.x + off.x,
      y: hubC.y + off.y
    };
    return { p0: fromC, p1: ctrl, p2: toC };
  }

  // De Casteljau split: path segment of the quad curve from t=0 to t.
  function partialQuadD(curve, t) {
    var p01, p12, p;
    p01 = {
      x: curve.p0.x + (curve.p1.x - curve.p0.x) * t,
      y: curve.p0.y + (curve.p1.y - curve.p0.y) * t
    };
    p12 = {
      x: curve.p1.x + (curve.p2.x - curve.p1.x) * t,
      y: curve.p1.y + (curve.p2.y - curve.p1.y) * t
    };
    p = {
      x: p01.x + (p12.x - p01.x) * t,
      y: p01.y + (p12.y - p01.y) * t
    };
    return "M " + curve.p0.x + " " + curve.p0.y +
      " Q " + p01.x + " " + p01.y + " " + p.x + " " + p.y;
  }

  function syncTrailsSize() {
    if (!trailsEl) return;
    var w = stage.clientWidth;
    var h = stage.clientHeight;
    trailsEl.setAttribute("width", w);
    trailsEl.setAttribute("height", h);
    trailsEl.setAttribute("viewBox", "0 0 " + w + " " + h);
  }

  function pruneTrails() {
    while (activeTrails.length > MAX_TRAILS) {
      var old = activeTrails.shift();
      if (old && old.parentNode) old.parentNode.removeChild(old);
    }
  }

  function drawTrail(curve, hue, persist) {
    if (!trailsEl) return null;
    syncTrailsSize();
    var d = "M " + curve.p0.x + " " + curve.p0.y +
      " Q " + curve.p1.x + " " + curve.p1.y +
      " " + curve.p2.x + " " + curve.p2.y;
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "hsl(" + hue + ", 70%, 60%)");
    path.setAttribute("stroke-width", "2.5");
    path.setAttribute("stroke-dasharray", "8 6");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("opacity", "0.55");
    trailsEl.appendChild(path);
    // Persistent trails stay in the DOM and are never pruned; their rid owns them.
    if (!persist) {
      activeTrails.push(path);
      pruneTrails();
      setTimeout(function () {
        if (path.parentNode) path.parentNode.removeChild(path);
        var i;
        for (i = 0; i < activeTrails.length; i++) {
          if (activeTrails[i] === path) {
            activeTrails.splice(i, 1);
            break;
          }
        }
      }, TRAIL_FADE_MS);
    }
    return path;
  }

  function clearOutTrail(rid) {
    var st, path;
    if (!rid) return;
    st = liveState[rid];
    if (!st) return;
    path = st.outTrail;
    if (path && path.parentNode) path.parentNode.removeChild(path);
    delete st.outTrail;
  }

  function clearLiveLink(rid) {
    var path;
    if (!rid || !liveLinks[rid]) return;
    path = liveLinks[rid];
    if (path && path.parentNode) path.parentNode.removeChild(path);
    delete liveLinks[rid];
  }

  function liveLinkCurve(rid, agent, model) {
    var agentCell, hubC, from, to;
    if (!hubEl) return null;
    agentCell = findAgentCell(agent);
    if (!agentCell) return null;
    from = agentBorderPoint(agentCell);
    to = flierCenter(rid, model);
    if (!from || !to) return null;
    hubC = hubCenter();
    return buildCurve(from, hubC, to, agent, true);
  }

  function updateLiveLinkGeometry(rid) {
    var st, path, curve, d;
    st = liveState[rid];
    path = liveLinks[rid];
    if (!st || !path) return;
    curve = liveLinkCurve(rid, st.agent, st.model);
    if (!curve) return;
    d = "M " + curve.p0.x + " " + curve.p0.y +
      " Q " + curve.p1.x + " " + curve.p1.y +
      " " + curve.p2.x + " " + curve.p2.y;
    path.setAttribute("d", d);
  }

  function setLiveLink(rid, agent, model, hue) {
    var curve, d, path;
    if (!rid || !trailsEl) return;
    clearLiveLink(rid);
    curve = liveLinkCurve(rid, agent, model);
    if (!curve) return;
    syncTrailsSize();
    d = "M " + curve.p0.x + " " + curve.p0.y +
      " Q " + curve.p1.x + " " + curve.p1.y +
      " " + curve.p2.x + " " + curve.p2.y;
    path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "hsl(" + hue + ", 70%, 60%)");
    path.setAttribute("stroke-width", "2.5");
    path.setAttribute("stroke-dasharray", "8 6");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("opacity", "0.45");
    path.setAttribute("data-live-link", rid);
    trailsEl.appendChild(path);
    liveLinks[rid] = path;
  }

  function redrawLiveLinks() {
    var rid, st, keys, i;
    // Live links exist only for perched birds; "back" keeps an existing link
    // (geometry follows the pigeon) and "out"/"seed" must never have one.
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (!st) continue;
      if (st.phase === "perch") {
        setLiveLink(rid, st.agent, st.model, hashHue(st.agent));
      } else if (st.phase === "back") {
        if (liveLinks[rid]) updateLiveLinkGeometry(rid);
      } else {
        clearLiveLink(rid);
      }
    }
    // Drop stray links: rid gone from liveState, or phase no longer perch/back.
    keys = [];
    for (rid in liveLinks) {
      if (!liveLinks.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (!st || (st.phase !== "perch" && st.phase !== "back")) keys.push(rid);
    }
    for (i = 0; i < keys.length; i++) clearLiveLink(keys[i]);
  }

  function snapPerchedBirds() {
    var holders, rid, st, model, group, modelCell, perch, total, i, dx, rec;
    holders = {};
    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      st = liveState[rid];
      if (!st || st.phase !== "perch") continue;
      if (!holders[st.model]) holders[st.model] = [];
      holders[st.model].push(rid);
    }
    for (model in holders) {
      if (!holders.hasOwnProperty(model)) continue;
      group = holders[model];
      modelCell = findModelCell(model);
      if (!modelCell) continue;
      perch = perchOnNode(modelCell);
      if (!perch) continue;
      total = group.length;
      for (i = 0; i < total; i++) {
        rid = group[i];
        rec = fliers[rid];
        if (!rec) rec = ensureFlier(rid, hashHue((liveState[rid] && liveState[rid].agent) || ""));
        if (rec.animTimer) continue;
        dx = total > 1 ? (i - (total - 1) / 2) * 24 : 0;
        placeBirdOn(rec, perch.left + dx, perch.top, perch.face);
      }
    }
  }

  function animateFlier(rec, curve, durationMs, onStep, onDone) {
    var steps, i, prev, start;
    if (!rec) return;
    stopFlierAnim(rec);
    steps = Math.max(8, Math.round(durationMs / STEP_MS));
    i = 0;
    prev = curve.p0;
    start = leftTopFromCenter(curve.p0.x, curve.p0.y);
    placeBirdOn(rec, start.left, start.top, null);
    rec.animTimer = setInterval(function () {
      var t, pt, pos, dx;
      i += 1;
      t = i / steps;
      if (t > 1) t = 1;
      pt = quadPoint(curve.p0, curve.p1, curve.p2, t);
      pos = leftTopFromCenter(pt.x, pt.y);
      dx = pt.x - prev.x;
      if (Math.abs(dx) > 0.5) setFaceOn(rec, dx >= 0 ? 1 : -1);
      placeBirdOn(rec, pos.left, pos.top, null);
      prev = pt;
      if (onStep) onStep(rec, t);
      if (t >= 1) {
        stopFlierAnim(rec);
        if (onDone) onDone(rec);
      }
    }, STEP_MS);
  }

  function hubBirdPos() {
    var hc = hubCenter();
    var left = (stage.clientWidth / 2) - (BIRD_W / 2);
    var top = hc.y - (BIRD_H / 2) - 30;
    if (top < 0) top = 0;
    return { left: left, top: top };
  }

  function updateIdleBird() {
    var p;
    if (hasLiveFlier()) {
      if (idleRec && idleRec.el) idleRec.el.style.visibility = "hidden";
      return;
    }
    if (!idleRec) idleRec = createFlierRecord("__idle", 215);
    p = hubBirdPos();
    placeBirdOn(idleRec, p.left, p.top, 1);
  }

  function syncOrders(rows) {
    var i, row, agent, model, prov;
    for (i = 0; i < rows.length; i++) {
      row = rows[i] || {};
      agent = agentOf(row);
      // Only refresh agent TTL for in-flight or recent routes — not the whole ring buffer.
      if (routeIsRecent(row)) touchAgent(agent);
      model = modelOf(row);
      if (!model) continue;
      prov = row.providerName || row.provider || "";
      ensureModel(model, prov);
    }
  }

  function rebuildAgents() {
    var html = [];
    var i, name;
    for (i = 0; i < agentOrder.length; i++) {
      name = agentOrder[i];
      html.push(
        '<div class="agent-cell" data-agent="' + esc(name) + '">' +
          esc(shortName(name, 18)) +
        "</div>"
      );
    }
    agentsEl.innerHTML = html.join("");
  }

  function layoutModelGrid() {
    var N = chipOrder.length;
    var maxByWidth, cols, rem, alt, cells, i;
    if (!modelsEl) return;
    if (N < 1) {
      modelsEl.style.display = "";
      modelsEl.style.gridTemplateColumns = "";
      return;
    }
    maxByWidth = Math.max(1, Math.floor((modelsEl.clientWidth || stage.clientWidth || 320) / 140));
    cols = Math.ceil(Math.sqrt(N));
    rem = N % cols;
    if (rem && cols < N) {
      alt = cols + 1;
      if (alt <= maxByWidth && (N % alt === 0 || rem === 1)) {
        cols = alt;
      }
    }
    cols = Math.max(1, Math.min(N, cols, maxByWidth));
    modelsEl.style.display = "grid";
    modelsEl.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    modelsEl.style.gap = "24px";
    modelsEl.style.width = "100%";
    cells = modelsEl.getElementsByClassName("model-cell");
    for (i = 0; i < cells.length; i++) {
      cells[i].style.width = "auto";
      cells[i].style.float = "none";
      cells[i].style.margin = "0";
    }
  }

  function rebuildModels() {
    var html = [];
    var i, name, prov;
    for (i = 0; i < chipOrder.length; i++) {
      name = chipOrder[i];
      prov = chipProv[name] || "";
      html.push(
        '<div class="model-cell" data-model="' + esc(name) + '">' +
          '<span class="chip-name">' + esc(shortName(name, 20)) + "</span>" +
          (prov ? '<span class="chip-prov">' + esc(prov) + "</span>" : "") +
        "</div>"
      );
    }
    modelsEl.innerHTML = html.join("");
    layoutModelGrid();
  }

  function ensureDom() {
    var aKey = agentOrder.join("|");
    var cKey = chipOrder.join("|");
    var changed = false;
    if (aKey !== lastAgentKey) {
      rebuildAgents();
      lastAgentKey = aKey;
      changed = true;
    }
    if (cKey !== lastChipKey) {
      rebuildModels();
      lastChipKey = cKey;
      changed = true;
    }
    if (changed) {
      redrawLiveLinks();
      snapPerchedBirds();
      updateIdleBird();
    }
  }

  function centersFor(job) {
    var agentCell, modelCell, agentC, modelC, hubC;
    if (!hubEl) return null;
    agentCell = findAgentCell(job.agent);
    modelCell = findModelCell(job.model);
    if (!agentCell || !modelCell) return null;
    agentC = birdNodeCenter(agentCell);
    modelC = flierCenter(job.rid, job.model);
    if (!agentC || !modelC) return null;
    hubC = hubCenter();
    return { agentC: agentC, modelC: modelC, hubC: hubC };
  }

  function startOutbound(rid) {
    var st = liveState[rid];
    var job, pts, rec, outCurve, outPath;
    if (!st) return;
    job = { agent: st.agent, model: st.model, hue: hashHue(st.agent), rid: rid };
    pts = centersFor(job);
    if (!pts) {
      clearOutTrail(rid);
      clearLiveLink(rid);
      destroyFlier(rid);
      delete liveState[rid];
      refreshHighlights();
      updateIdleBird();
      return;
    }
    refreshHighlights();
    st.phase = "out";
    rec = ensureFlier(rid, job.hue);
    outCurve = buildCurve(pts.agentC, pts.hubC, pts.modelC, job.agent, true);
    outPath = drawTrail(outCurve, job.hue, true);
    // No live link until the bird lands; trail grows with the bird instead.
    if (outPath) outPath.setAttribute("d", partialQuadD(outCurve, 0));
    showBerryOn(rec, job.hue);
    boostWingsOn(rec);
    flyingCount += 1;
    updateIdleBird();
    animateFlier(rec, outCurve, FLY_MS, function (_rec, t) {
      if (outPath) outPath.setAttribute("d", partialQuadD(outCurve, t));
    }, function () {
      var modelCell, perch, cur;
      flyingCount -= 1;
      boostWingsOn(rec);
      cur = liveState[rid];
      if (!cur) {
        if (outPath && outPath.parentNode) outPath.parentNode.removeChild(outPath);
        destroyFlier(rid);
        updateIdleBird();
        return;
      }
      // Keep the outbound flight trail visible at normal opacity.
      if (outPath) cur.outTrail = outPath;
      modelCell = findModelCell(cur.model);
      perch = modelCell ? perchOnNode(modelCell) : null;
      if (perch) placeBirdOn(rec, perch.left, perch.top, perch.face);
      cur.phase = "perch";
      refreshHighlights();
      setLiveLink(rid, cur.agent, cur.model, hashHue(cur.agent));
      snapPerchedBirds();
      updateLiveLinkGeometry(rid);
      updateIdleBird();
      if (cur.pendingReturn) {
        cur.pendingReturn = false;
        startReturnFor(rid);
      }
    });
  }

  function startReturnFor(rid) {
    var st = liveState[rid];
    var job, pts, rec, backCurve;
    if (!st) return;
    if (st.phase === "done" || st.phase === "back") return;
    if (st.phase === "seed") {
      clearOutTrail(rid);
      clearLiveLink(rid);
      destroyFlier(rid);
      delete liveState[rid];
      refreshHighlights();
      updateIdleBird();
      return;
    }
    if (st.phase === "out") {
      st.pendingReturn = true;
      return;
    }
    if (st.phase !== "perch") return;
    job = { agent: st.agent, model: st.model, hue: hashHue(st.agent), rid: rid };
    pts = centersFor(job);
    if (!pts) {
      clearOutTrail(rid);
      clearLiveLink(rid);
      destroyFlier(rid);
      delete liveState[rid];
      refreshHighlights();
      updateIdleBird();
      return;
    }
    st.phase = "back";
    refreshHighlights();
    rec = fliers[rid];
    if (!rec) rec = ensureFlier(rid, job.hue);
    hideBerryOn(rec);
    boostWingsOn(rec);
    flyingCount += 1;
    backCurve = buildCurve(pts.modelC, pts.hubC, pts.agentC, job.agent, false);
    drawTrail(backCurve, job.hue);
    animateFlier(rec, backCurve, FLY_MS, function () {
      updateLiveLinkGeometry(rid);
    }, function () {
      var agentCell, perch;
      flyingCount -= 1;
      agentCell = findAgentCell(job.agent);
      perch = agentCell ? perchOnNode(agentCell) : null;
      if (perch) placeBirdOn(rec, perch.left, perch.top, perch.face);
      clearOutTrail(rid);
      clearLiveLink(rid);
      if (liveState[rid]) liveState[rid].phase = "done";
      delete liveState[rid];
      refreshHighlights();
      setTimeout(function () {
        destroyFlier(rid);
        updateIdleBird();
      }, 260);
    });
  }

  function processLive(routes) {
    var i, row, rid, agent, model, done, present;
    var list = routes || [];
    var current = {};

    syncOrders(list);

    if (firstLoad) {
      for (i = 0; i < list.length; i++) {
        row = list[i] || {};
        rid = ridOf(row);
        seenRids[rid] = true;
        liveState[rid] = {
          phase: row.done === false ? "seed" : "done",
          agent: agentOf(row),
          model: modelOf(row),
          pendingReturn: false
        };
        if (row.done !== false) delete liveState[rid];
      }
      pruneAgents();
      ensureDom();
      firstLoad = false;
      return;
    }

    for (i = 0; i < list.length; i++) {
      row = list[i] || {};
      rid = ridOf(row);
      current[rid] = true;
      agent = agentOf(row);
      model = modelOf(row);
      done = row.done !== false;
      // agent TTL / order: syncOrders already touched recent/in-flight
      ensureModel(model, row.providerName || row.provider || "");

      if (!seenRids[rid]) {
        seenRids[rid] = true;
        if (done) {
          continue;
        }
        liveState[rid] = {
          phase: "out",
          agent: agent,
          model: model,
          pendingReturn: false
        };
        ensureDom();
        startOutbound(rid);
        continue;
      }

      if (liveState[rid]) {
        if (agent) liveState[rid].agent = agent;
        if (model) liveState[rid].model = model;
        if (done) startReturnFor(rid);
      }
    }

    for (rid in liveState) {
      if (!liveState.hasOwnProperty(rid)) continue;
      if (current[rid]) continue;
      present = liveState[rid];
      if (!present) continue;
      if (present.phase === "out" || present.phase === "perch" || present.phase === "seed") {
        startReturnFor(rid);
      }
    }

    pruneAgents();
    ensureDom();
    redrawLiveLinks();
    snapPerchedBirds();
    updateIdleBird();
  }

  function tick() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/live", true);
    xhr.timeout = 8000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        var data;
        try {
          data = JSON.parse(xhr.responseText);
        } catch (e) {
          setMeta(false, "bad json");
          return;
        }
        var routes = (data && data.routes) ? data.routes : [];
        var inflight = 0;
        var j;
        for (j = 0; j < routes.length; j++) {
          if (routes[j] && routes[j].done === false) inflight += 1;
        }
        processLive(routes);
        setMeta(
          true,
          "in " + inflight +
            " · live " + countInflight() +
            (flyingCount > 0 ? " · flying " + flyingCount : "")
        );
      } else {
        setMeta(false, "http " + xhr.status);
      }
    };
    xhr.ontimeout = function () {
      setMeta(false, "timeout");
    };
    xhr.onerror = function () {
      setMeta(false, "network");
    };
    xhr.send(null);
  }

  function onResize() {
    layoutModelGrid();
    redrawLiveLinks();
    snapPerchedBirds();
    updateIdleBird();
  }

  if (window.addEventListener) {
    window.addEventListener("resize", onResize, false);
  } else if (window.attachEvent) {
    window.attachEvent("onresize", onResize);
  }

  tick();
  setInterval(tick, REFRESH_MS);
})();
</script>
</body>
</html>
